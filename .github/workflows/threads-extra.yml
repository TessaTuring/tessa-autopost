name: Threads - morning and evening posts

on:
  schedule:
    - cron: "30 13 * * *"   # morning tip, 8:30 AM Eastern (9:30 during daylight time)
    - cron: "0 23 * * *"    # evening question, 6 PM Eastern (7 PM during daylight time)
  workflow_dispatch:
    inputs:
      slot:
        description: "am or pm"
        required: true
        default: "am"
      date:
        description: "Date (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: tessa-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check the review issue
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            if [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then SLOT=am; else SLOT=pm; fi
          fi
          LABEL=$([ "$SLOT" = am ] && echo morning || echo evening)
          DAY="${{ github.event.inputs.date }}"
          [ -z "$DAY" ] && DAY=$(TZ=America/New_York date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"; echo "slot=$SLOT" >> "$GITHUB_OUTPUT"; echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          if [ ! -f "threads/$DAY-$SLOT.json" ]; then
            echo "::notice::No $LABEL post drafted for $DAY."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TITLE="Threads for $DAY"
          ISSUE=$(gh issue list --state all --search "in:title \"$TITLE\"" --json number,title,state,labels \
            --jq "[.[] | select(.title==\"$TITLE\")][0]")
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            echo "::notice::No review issue for $DAY."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NUM=$(echo "$ISSUE" | jq -r .number)
          STATE=$(echo "$ISSUE" | jq -r .state)
          POSTED=$(echo "$ISSUE" | jq -r '[.labels[].name] | index("posted") != null')
          echo "issue=$NUM" >> "$GITHUB_OUTPUT"
          DONE=$(gh issue view "$NUM" --json comments --jq "[.comments[].body | select(startswith(\"Posted ($LABEL)\"))] | length")
          if [ "$DONE" != "0" ]; then
            echo "::notice::The $LABEL post already went out."; echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$STATE" != "OPEN" ] && [ "$POSTED" != "true" ]; then
            echo "::notice::Issue #$NUM was closed, so $DAY is skipped."; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Threads
        if: steps.check.outputs.go == 'yes'
        id: post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: echo "link=$(python scripts/threads_publish.py ${{ steps.check.outputs.day }} ${{ steps.check.outputs.slot }})" >> "$GITHUB_OUTPUT"

      - name: Note it on the issue
        if: steps.check.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ steps.check.outputs.issue }} --body "Posted (${{ steps.check.outputs.label }}): ${{ steps.post.outputs.link }}"

      - name: Report a failure on the issue
        if: failure() && steps.check.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ steps.check.outputs.issue }} --body "The ${{ steps.check.outputs.label }} Threads post failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
