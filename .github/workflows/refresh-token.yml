name: Refresh Instagram token

on:
  schedule:
    - cron: "0 10 * * 1"   # every Monday; the token lasts 60 days
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Refresh and store the new token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          NEW=$(python scripts/refresh_token.py)
          if [ -z "$NEW" ]; then echo "::notice::Token never expires. Nothing to refresh."; exit 0; fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
