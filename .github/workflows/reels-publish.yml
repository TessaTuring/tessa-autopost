name: Publish today's Reel

on:
  schedule:
    - cron: "30 17 * * *"   # 12:30 PM Eastern (1:30 PM during daylight time)
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: tessa-content
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check the carousel went out today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ github.event.inputs.date }}"
          [ -z "$DAY" ] && DAY=$(TZ=America/New_York date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          TITLE="Post for $DAY"
          ISSUE=$(gh issue list --state all --search "in:title \"$TITLE\"" --json number,title,labels \
            --jq "[.[] | select(.title==\"$TITLE\")][0]")
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ] || [ ! -f "drafts/$DAY/post.json" ]; then
            echo "::notice::No carousel for $DAY."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NUM=$(echo "$ISSUE" | jq -r .number)
          echo "issue=$NUM" >> "$GITHUB_OUTPUT"
          POSTED=$(echo "$ISSUE" | jq -r '[.labels[].name] | index("posted") != null')
          DONE=$(gh issue view "$NUM" --json comments --jq '[.comments[].body | select(startswith("Reel posted"))] | length')
          if [ "$POSTED" != "true" ]; then
            echo "::notice::The carousel didn't go out (skipped or failed), so no Reel."; echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$DONE" != "0" ]; then
            echo "::notice::Reel already posted."; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Make the video and save it to the repo
        if: steps.check.outputs.go == 'yes'
        run: |
          DAY="${{ steps.check.outputs.day }}"
          [ -f "drafts/$DAY/reel.mp4" ] || python scripts/reel.py "$DAY"
          git config user.name "tessa-bot"
          git config user.email "tessa-bot@users.noreply.github.com"
          git add "drafts/$DAY/reel.mp4"
          git diff --cached --quiet || git commit -m "Reel for $DAY"
          git pull --rebase && git push
          sleep 20   # give the public file URL a moment

      - name: Post the Reel to Instagram
        if: steps.check.outputs.go == 'yes'
        id: post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: echo "link=$(python scripts/publish_reel.py ${{ steps.check.outputs.day }})" >> "$GITHUB_OUTPUT"

      - name: Note it on the issue
        if: steps.check.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ steps.check.outputs.issue }} --body "Reel posted: ${{ steps.post.outputs.link }}"

      - name: Report a failure on the issue
        if: failure() && steps.check.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ steps.check.outputs.issue }} --body "The Reel failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
